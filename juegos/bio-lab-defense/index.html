<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070e1b" />
    <meta
      name="description"
      content="Bio-Lab Defense, un juego de defensa de torres gratis. Combina doce torres, protege el núcleo y supera los diez sectores del laboratorio."
    />
    <meta name="rewarded-adsense-client" content="ca-pub-6088460231287739" />
    <meta property="og:title" content="Bio-Lab Defense · TronkStudios" />
    <meta
      property="og:image"
      content="https://tronkstudios.github.io/img/juegos/mini/bio-lab-defense.webp"
    />
    <link
      rel="canonical"
      href="https://tronkstudios.github.io/juegos/bio-lab-defense/"
    />
    <link rel="icon" href="/favicon.png" />
    <link rel="stylesheet" href="./styles.css?v=1" />
    <title>Bio-Lab Defense · TronkStudios</title>
  </head>
  <body>
    <header class="site-bar">
      <a href="/#minijuegos" class="back-link">← Minijuegos</a>
      <a href="/#account-button" class="brand"
        >Cuenta · TRONK<span>STUDIOS</span></a
      >
    </header>
    <main>
      <section id="home" aria-labelledby="title">
        <div class="hero">
          <img
            class="hero-image"
            src="/img/juegos/mini/bio-lab-defense.webp"
            alt=""
            width="640"
            height="360"
          />
          <div class="hero-body">
            <h1 id="title">Bio-Lab <span>Defense</span></h1>
            <p>
              Protege el núcleo. Combina torres, mejora tus defensas y aguanta
              hasta la última oleada.
            </p>
            <div class="actions">
              <button type="button" class="primary" id="campaign-button">
                Jugar campaña
              </button>
              <button type="button" id="daily-button">Suministro diario</button>
            </div>
          </div>
        </div>
        <output id="home-status" role="status"></output>
      </section>
      <section id="campaign" hidden aria-labelledby="campaign-title">
        <div class="section-head">
          <div>
            <button type="button" id="back-home">← Menú</button>
            <h1 id="campaign-title">Sectores del laboratorio</h1>
          </div>
          <p id="profile-balance"></p>
        </div>
        <div id="levels" class="levels"></div>
      </section>
      <section id="field" hidden aria-label="Partida">
        <div class="section-head field-head">
          <div>
            <h1 id="sector"></h1>
            <p id="phase"></p>
          </div>
          <button type="button" id="pause">Pausa</button>
        </div>
        <div class="hud">
          <div>
            <span>Núcleo</span><strong id="hp"></strong
            ><meter
              id="integrity"
              min="0"
              max="100"
              value="100"
              aria-label="Integridad del núcleo"
            ></meter>
          </div>
          <div><span>ATP</span><strong id="atp"></strong></div>
          <div><span>Oleadas</span><strong id="wave"></strong></div>
          <div><span>Combo</span><strong id="combo"></strong></div>
        </div>
        <div class="game-layout">
          <div class="arena">
            <canvas
              id="board"
              width="900"
              height="540"
              tabindex="0"
              aria-label="Tablero. Flechas para mover el cursor y Espacio para colocar o elegir torre."
            ></canvas>
            <p id="board-status" role="status"></p>
            <div class="wave-actions">
              <button type="button" id="next" class="primary">
                Iniciar oleada
              </button>
              <button type="button" id="speed" aria-pressed="false">
                Velocidad ×1
              </button>
            </div>
          </div>
          <aside class="controls" aria-label="Controles de defensa">
            <h2>Torres</h2>
            <div id="dock"></div>
            <div id="selection"></div>
            <div class="supplies">
              <button type="button" id="boost" hidden>
                Ver anuncio · +75 ATP
              </button>
              <button type="button" id="buy-atp">
                +60 ATP · 100 de reserva
              </button>
              <button type="button" id="heal">Reparar +25 · 5 biogemas</button>
            </div>
          </aside>
        </div>
      </section>
      <p id="account-status" role="status">Comprobando cuenta…</p>
    </main>
    <dialog id="modal" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <div id="modal-actions" class="actions"></div>
    </dialog>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
      defer
    ></script>
    <script type="module" src="./game.js?v=1"></script>
  </body>
</html>
