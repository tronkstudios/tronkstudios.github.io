<!-- TronkStudios · partials/antitronks.html
     Ventana del minijuego. js/games/loader.js la añade a la página la
     primera vez que se abre el juego (antes estaba dentro de index.html). -->
  <!-- =====================================================
       MINIJUEGO ANTITRONKS
       ===================================================== -->

  <div
    id="antitronks-modal"
    class="antitronks-modal hidden"
    aria-hidden="true"
  >

    <div class="antitronks-backdrop"></div>

    <div
      class="antitronks-window"
      role="dialog"
      aria-modal="true"
      aria-labelledby="antitronks-title"
    >

      <header class="antitronks-header">
        <h2 id="antitronks-title">ANTITRONKS</h2>

        <button
          class="antitronks-sound game-sound-toggle"
          type="button"
          aria-label="Silenciar"
          aria-pressed="false"
        ><svg class="icon" aria-hidden="true"><use href="#i-volume"></use></svg></button>

        <button
          id="antitronks-close"
          class="antitronks-close"
          type="button"
          aria-label="Cerrar Antitronks"
        ><svg class="icon close-icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
      </header>

      <div class="antitronks-game" id="antitronks-game">
        <canvas id="antitronks-canvas"></canvas>

        <div class="antitronks-hud" aria-hidden="true">
          <div class="antitronks-score" id="antitronks-score">PUNTOS: 0</div>
          <div class="antitronks-lives" id="antitronks-lives">VIDAS: 3</div>
          <div class="antitronks-record" id="antitronks-record">RÉCORD: 0</div>
          <div class="antitronks-hit-flash" id="antitronks-hit-flash"></div>

          <div class="antitronks-message" id="antitronks-message">
            <span id="antitronks-message-text"></span>
          </div>

          <div class="antitronks-overlay" id="antitronks-overlay">
            <div class="antitronks-overlay-box">
              <h3 id="antitronks-overlay-title">ANTITRONKS</h3>
              <p id="antitronks-overlay-text">
                Apunta con el ratón y haz clic para disparar a los Antitronks. Gira la cámara con A (izquierda) y D (derecha).
              </p>
              <button
                id="antitronks-start"
                class="antitronks-start-button"
                type="button"
              >
                JUGAR
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
