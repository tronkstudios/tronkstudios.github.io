# =========================================================
# Configuración del backend de soporte de TronkStudios
# (Cloudflare Worker)
#
# Aquí SOLO van valores públicos. Las claves secretas se guardan con:
#   npx wrangler secret put AI_API_KEY
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put SUPPORT_EMAIL_TO
#   npx wrangler secret put TURNSTILE_SECRET   (opcional)
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY   (avisos de lanzamiento)
# =========================================================

name = "tronkstudios-support"
main = "index.js"
compatibility_date = "2025-09-01"

[vars]
# Webs que pueden usar este backend (separadas por comas, sin barra final).
# Para probar en local puedes añadir: ,http://127.0.0.1:5500
ALLOWED_ORIGINS = "https://tronkstudios.github.io"

# Proveedor de IA del chat de Tronker: "workers-ai" (gratis, de Cloudflare,
# sin clave), "anthropic" u "openai-compatible" (estos dos necesitan AI_API_KEY)
AI_PROVIDER = "workers-ai"

# Modelo del proveedor elegido (cámbialo si usas otro proveedor)
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Solo para "openai-compatible": dirección base de la API, por ejemplo
# "https://api.proveedor.com/v1". Con "anthropic" se deja vacío.
AI_BASE_URL = ""

# Remitente de los correos del formulario.
# Sin dominio propio en Resend, usa exactamente este.
MAIL_FROM = "Soporte TronkStudios <onboarding@resend.dev>"

# Supabase, para los avisos de lanzamiento por correo (dirección pública)
SUPABASE_URL = "https://qjjnqhbtovjcbwgcwhgl.supabase.co"

# Workers AI (IA gratis de Cloudflare para el chat de Tronker)
[ai]
binding = "AI"

# Límite de peticiones por visitante (IP) gestionado por Cloudflare.
# period solo puede ser 10 o 60 segundos.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

[[ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "1002"
simple = { limit = 2, period = 60 }

# Avisos de lanzamiento: se revisan una vez al día (9:00 UTC)
[triggers]
crons = ["0 9 * * *"]
